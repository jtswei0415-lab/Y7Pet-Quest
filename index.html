-items:center;font-size:14px;font-weight:950;flex:0 0 auto;color:#777391}.answer-text{font-weight:850;font-size:clamp(16px,2.3vw,20px);line-height:1.35}.answer.correct{background:#eff9ee;border-color:#64b58d;box-shadow:0 3px 0 #abdbbd}.answer.correct .answer-letter{background:#c8ebd3;color:#217245}.answer.wrong{background:#fff2f2;border-color:#e69ea3;box-shadow:0 3px 0 #f4c9cb}.answer.wrong .answer-letter{background:#ffd8d9;color:#ab4353}.answer:disabled{opacity:1}.answer.dimmed{opacity:.58}.feedback{display:flex;align-items:flex-start;gap:12px;background:#ecf8ef;border:1px solid #cde9d1;border-radius:17px;padding:16px 18px;margin-top:18px}.feedback.wrong{background:#fff2f0;border-color:#fad4d0}.feedback-icon{font-size:26px;line-height:1.2}.feedback strong{display:block;font-size:18px}.feedback p{margin:5px 0 0;font-size:14px;line-height:1.6;color:#607169}.feedback.wrong p{color:#8b6467}.game-actions{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:24px}.helper{color:#9895a5;font-size:12px}.next-btn{min-width:155px}

{min-width:90px;padding:10px}.stat b{font-size:20px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

<body>
<div class="ambient a1"></div><div class="ambient a2"></div><div class="ambient a3"></div>
<header class="header"><div class="brand"><div class="brand-icon" aria-hidden="true">🐾</div><div>PET QUEST <small>CHINESE • YEAR 7</small></div></div><div class="header-right"><div class="pill" aria-label="Score">⭐ <span id="score" class="score-value">0</span></div><button id="sound" class="audio-btn" type="button" aria-label="Turn sound on" title="Toggle game sounds">🔇</button></div></header>
<main><section id="app" class="shell" aria-live="polite"></section><p class="footer">Made for Year 7 Chinese learners · Free to play · No login or personal information required · Works offline</p></main>
<script>
'use strict';
const levels=[
 {title:'Pet Detective',zh:'宠物侦探',subtitle:'认识宠物 · Know your pets',theme:'🔍',questions:[
  {emoji:'🐱',label:'LOOK & CHOOSE',prompt:'这是什么宠物？',en:'Which Chinese word means cat?',pinyin:'Zhè shì shénme chǒngwù?',options:['狗','猫','兔子','鸟'],correct:1,explain:'猫 (māo) means cat.'},
  {emoji:'🐶',label:'LOOK & CHOOSE',prompt:'这是什么宠物？',en:'Which Chinese word means dog?',pinyin:'Zhè shì shénme chǒngwù?',options:['鱼','乌龟','狗','马'],correct:2,explain:'狗 (gǒu) means dog.'},
  {emoji:'🐰',label:'LOOK & CHOOSE',prompt:'这是什么宠物？',en:'Which Chinese word means rabbit?',pinyin:'Zhè shì shénme chǒngwù?',options:['兔子','仓鼠','猫','鱼'],correct:0,explain:'兔子 (tùzi) means rabbit.'},
  {emoji:'🐢',label:'LOOK & CHOOSE',prompt:'这是什么宠物？',en:'Which Chinese word means turtle?',pinyin:'Zhè shì shénme chǒngwù?',options:['鸟','狗','仓鼠','乌龟'],correct:3,explain:'乌龟 (wūguī) means turtle.'},
  {emoji:'🐠',label:'LOOK & CHOOSE',prompt:'这是什么宠物？',en:'Which Chinese word means fish?',pinyin:'Zhè shì shénme chǒngwù?',options:['马','鱼','猫','兔子'],correct:1,explain:'鱼 (yú) means fish.'}
 ]},
 {title:'Sentence Safari',zh:'句子探险',subtitle:'理解句子 · Read and understand',theme:'📖',questions:[
  {emoji:'🐹',label:'READ & UNDERSTAND',prompt:'我有一只仓鼠。',en:'What does the sentence mean?',pinyin:'Wǒ yǒu yì zhī cāngshǔ.',options:['I have a hamster.','I have a rabbit.','I like hamsters.','I have two hamsters.'],correct:0,explain:'我有 = I have; 一只 = one (animal); 仓鼠 = hamster.'},
  {emoji:'🐦',label:'READ & UNDERSTAND',prompt:'我的鸟很漂亮。',en:'Choose the best translation.',pinyin:'Wǒ de niǎo hěn piàoliang.',options:['My cat is cute.','The bird is small.','My bird is beautiful.','I want a bird.'],correct:2,explain:'我的 = my; 鸟 = bird; 很漂亮 = very beautiful.'},
  {emoji:'🐇',label:'READ & UNDERSTAND',prompt:'我喜欢兔子，因为它很可爱。',en:'Why does the speaker like rabbits?',pinyin:'Wǒ xǐhuan tùzi, yīnwèi tā hěn kě’ài.',options:['Because they are big.','Because they are cute.','Because they are fast.','Because they are quiet.'],correct:1,explain:'因为 = because; 很可爱 = very cute.'},
  {emoji:'🏡',label:'READ & UNDERSTAND',prompt:'我没有宠物。',en:'What does the speaker say?',pinyin:'Wǒ méiyǒu chǒngwù.',options:['I love pets.','I have many pets.','I want a pet.','I do not have a pet.'],correct:3,explain:'没有 (méiyǒu) means do not have.'},
  {emoji:'🐈',label:'READ & UNDERSTAND',prompt:'你有几只猫？',en:'What is the speaker asking?',pinyin:'Nǐ yǒu jǐ zhī māo?',options:['What colour is your cat?','How many cats do you have?','Do you like cats?','Where is your cat?'],correct:1,explain:'几只 (jǐ zhī) asks how many animals.'}
 ]},
 {title:'Pet Master',zh:'宠物大师',subtitle:'完整表达 · Build Chinese sentences',theme:'🏆',questions:[
  {emoji:'🐱🐱',label:'CHINESE CHALLENGE',prompt:'I have two cats.',en:'Choose the correct Chinese sentence.',pinyin:'Hint: two = 两 (liǎng)',options:['我有两只猫。','我有两条猫。','我有一只猫。','我喜欢两猫。'],correct:0,explain:'两只猫 = two cats. 只 (zhī) is a measure word for many animals.'},
  {emoji:'🐟',label:'CHINESE CHALLENGE',prompt:'I have a fish.',en:'Choose the correct Chinese sentence.',pinyin:'Hint: fish use the measure word 条 (tiáo)',options:['我有一只鱼。','我没有鱼。','我有一条鱼。','我是鱼。'],correct:2,explain:'一条鱼 = one fish. 条 (tiáo) is the measure word used here.'},
  {emoji:'🐾',label:'CHINESE CHALLENGE',prompt:'I do not have a pet.',en:'Choose the correct Chinese sentence.',pinyin:'Hint: do not have = 没有 (méiyǒu)',options:['我有宠物。','我没有宠物。','我不喜欢宠物。','你有宠物吗？'],correct:1,explain:'我没有宠物。= I do not have a pet.'},
  {emoji:'❓',label:'CHINESE CHALLENGE',prompt:'Do you have a pet?',en:'Choose the correct Chinese question.',pinyin:'Hint: use 吗 (ma) for a yes/no question',options:['你喜欢什么宠物？','我有一只狗。','你有几只猫？','你有宠物吗？'],correct:3,explain:'你有宠物吗？ uses 吗 to make a yes/no question.'},
  {emoji:'🐰💗',label:'FINAL CHALLENGE',prompt:'My rabbit is very cute.',en:'Choose the correct Chinese sentence.',pinyin:'Hint: cute = 可爱 (kě’ài)',options:['我的兔子很可爱。','我的狗很漂亮。','我有一条兔子。','兔子不喜欢我。'],correct:0,explain:'我的兔子很可爱。= My rabbit is very cute.'}
 ]}
];
const app=document.getElementById('app'),scoreEl=document.getElementById('score'),soundBtn=document.getElementById('sound');
let levelIndex=0,questionIndex=0,score=0,streak=0,correctInLevel=0,results=[],answered=false,pinyinVisible=false,soundOn=false,finished=false,answerChoice=-1;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const letters=['A','B','C','D'];
function playTone(win){if(!soundOn)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const t=ctx.currentTime;[0,1,2].forEach((i)=>{const osc=ctx.createOscillator(),vol=ctx.createGain();osc.type='sine';osc.frequency.value=(win?[523,659,784]:[330,294,247])[i];vol.gain.setValueAtTime(.0001,t+i*.09);vol.gain.exponentialRampToValueAtTime(.08,t+i*.09+.015);vol.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.16);osc.connect(vol);vol.connect(ctx.destination);osc.start(t+i*.09);osc.stop(t+i*.09+.18)});setTimeout(()=>ctx.close(),650)}catch(e){}}
function confetti(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['#7c65db','#fac76b','#ec9fbd','#8ad9a1','#82caf0'];for(let i=0;i<45;i++){const el=document.createElement('i');el.className='confetti';el.style.cssText=`left:${Math.random()*100}vw;width:${6+Math.random()*7}px;height:${9+Math.random()*9}px;background:${colors[i%5]};animation-delay:${Math.random()*.6}s;transform:rotate(${Math.random()*360}deg)`;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}}
function intro(){app.innerHTML=`<div class="intro"><div><div class="eyebrow">🎮 PLAY • LEARN • LEVEL UP</div><h1>Pet Quest<span>宠物大冒险</span></h1><p class="desc">Ready to become a <span class="highlight">Chinese Pet Master</span>? Discover adorable pets, solve mini challenges and collect stars as you go!</p><button class="button play-btn" type="button" id="start">Let's play! 开始游戏 →</button><div class="tiny">✨ 3 levels &nbsp;·&nbsp; 15 questions &nbsp;·&nbsp; Instant feedback</div></div><div class="art" aria-label="Illustrated cat, dog, rabbit and turtle"><div class="art-blob"></div><div class="pet-art"><div class="pet-tile">🐱</div><div class="pet-tile">🐶</div><div class="pet-tile">🐰</div><div class="pet-tile">🐢</div></div><div class="floating-sticker sticker-a">+100 ⭐</div><div class="floating-sticker sticker-b">你好! 👋</div></div></div><div class="roadmap"><p class="road-title">Your adventure map 🗺️</p><div class="level-grid">${levels.map((l,i)=>`<div class="level-card"><div class="level-number">${i+1}</div><div><b>${esc(l.title)}</b><small>${esc(l.zh)} · ${i===0?'Vocabulary':i===1?'Reading':'Sentences'}</small></div></div>`).join('')}</div></div>`;document.getElementById('start').addEventListener('click',()=>{levelIndex=0;questionIndex=0;score=0;streak=0;correctInLevel=0;results=[];updateScore();renderQuestion()})}
function updateScore(){scoreEl.textContent=score.toLocaleString('en-AU')}
function renderQuestion(){answered=false;answerChoice=-1;pinyinVisible=false;const l=levels[levelIndex],q=l.questions[questionIndex];app.innerHTML=`<div class="game-head"><span class="round-tag">LEVEL ${levelIndex+1} / 3 · ${esc(l.zh)}</span><span class="question-counter">QUESTION ${questionIndex+1} OF ${l.questions.length}</span></div><div class="progress-track" role="progressbar" aria-label="Level progress" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${questionIndex}"><div class="progress-fill" style="width:${questionIndex/l.questions.length*100}%"></div></div><div class="game-content"><div class="question-top"><div class="mascot" aria-hidden="true">${q.emoji}</div><div><p class="q-kicker">${esc(q.label)}</p><h2 class="question-title">${esc(q.prompt)}</h2><p class="question-english">${esc(q.en)}</p></div></div><div class="hint-row"><button class="hint" id="hint" type="button" aria-expanded="false">💡 Show pinyin / hint</button><span class="pinyin" id="hint-text" hidden>${esc(q.pinyin)}</span></div><div class="answers" role="group" aria-label="Answer options">${q.options.map((o,i)=>`<button type="button" class="answer" data-answer="${i}"><span class="answer-letter">${letters[i]}</span><span class="answer-text">${esc(o)}</span></button>`).join('')}</div><div id="feedback-slot" role="status" aria-live="polite"></div><div class="game-actions"><span class="helper">💡 Select one answer to earn points</span><button type="button" id="next" class="button next-btn" disabled>${questionIndex===4?'Finish level →':'Next question →'}</button></div></div>`;document.querySelectorAll('[data-answer]').forEach(btn=>btn.addEventListener('click',()=>chooseAnswer(Number(btn.dataset.answer))));document.getElementById('hint').addEventListener('click',()=>{pinyinVisible=!pinyinVisible;document.getElementById('hint-text').hidden=!pinyinVisible;document.getElementById('hint').textContent=pinyinVisible?'🙈 Hide hint':'💡 Show pinyin / hint';document.getElementById('hint').setAttribute('aria-expanded',String(pinyinVisible))});document.getElementById('next').addEventListener('click',next)}
function chooseAnswer(idx){if(answered)return;answered=true;answerChoice=idx;const q=levels[levelIndex].questions[questionIndex],ok=idx===q.correct;document.querySelectorAll('[data-answer]').forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('correct');else if(i===idx)b.classList.add('wrong');else b.classList.add('dimmed')});if(ok){correctInLevel++;streak++;score+=100+(streak>1?20:0)}else streak=0;updateScore();document.getElementById('feedback-slot').innerHTML=`<div class="feedback ${ok?'':'wrong'}"><div class="feedback-icon">${ok?'🎉':'💪'}</div><div><strong>${ok?'太棒了！ Correct!':'Good try! Keep learning!'}</strong><p>${esc(q.explain)} ${ok?`<b>+${streak>1?120:100} points!</b>`:`The correct answer is <b>${esc(q.options[q.correct])}</b>.`}</p></div></div>`;document.getElementById('next').disabled=false;playTone(ok)}
function next(){if(!answered)return;if(questionIndex+1<levels[levelIndex].questions.length){questionIndex++;renderQuestion()}else{const completed=correctInLevel,stars=completed===5?3:completed>=3?2:1;results.push({correct:completed,stars});if(levelIndex===levels.length-1){finished=true;renderFinal()}else renderLevelEnd()}}
function renderLevelEnd(){const l=levels[levelIndex],r=results[results.length-1];if(r.correct>=4)confetti();app.innerHTML=`<div class="end-screen"><div class="medal">${r.correct>=4?'🏅':'🐾'}</div><div class="label">Level ${levelIndex+1} completed</div><h2>${r.correct===5?'Perfect paws!':r.correct>=3?'Fantastic work!':'Nice effort!'}<br>${esc(l.zh)}</h2><p>You've completed <b>${esc(l.title)}</b>. Ready for the next challenge?</p><div class="stars" aria-label="${r.stars} out of 3 stars">${'⭐'.repeat(r.stars)}${'☆'.repeat(3-r.stars)}</div><div class="stats"><div class="stat"><b>${r.correct}/5</b><small>Correct answers</small></div><div class="stat"><b>${score}</b><small>Total points</small></div></div><div class="end-actions"><button type="button" id="nextLevel" class="button">Unlock Level ${levelIndex+2} 🔓 →</button></div></div>`;document.getElementById('nextLevel').addEventListener('click',()=>{levelIndex++;questionIndex=0;correctInLevel=0;streak=0;renderQuestion()})}
function renderFinal(){confetti();const totalCorrect=results.reduce((s,r)=>s+r.correct,0),totalStars=results.reduce((s,r)=>s+r.stars,0);let best=0;try{best=Number(localStorage.getItem('petQuestHighScore')||'0');if(score>best){best=score;localStorage.setItem('petQuestHighScore',String(score))}}catch(e){best=score};app.innerHTML=`<div class="end-screen"><div class="medal">🏆</div><div class="label">All three levels completed!</div><h2>宠物大师！<br>You're a Pet Master!</h2><p>You explored Chinese pet vocabulary, understood sentences, and built your own expressions. 太棒了！</p><div class="stars">${'⭐'.repeat(Math.min(totalStars,3))}</div><div class="stats"><div class="stat"><b>${totalCorrect}/15</b><small>Correct</small></div><div class="stat"><b>${score}</b><small>Your points</small></div><div class="stat"><b>${totalStars}/9</b><small>Stars collected</small></div></div><div class="final-levels">${results.map((r,i)=>`<div class="final-lvl">${levels[i].theme} Level ${i+1} · ${'⭐'.repeat(r.stars)}</div>`).join('')}</div><p class="tiny">${score>=best?'🏆 New personal best!':`🏆 Personal best: ${best} points`}</p><div class="end-actions"><button type="button" id="again" class="button">Play again ↻</button><button type="button" id="home" class="button secondary">Back to home</button></div></div>`;document.getElementById('again').addEventListener('click',()=>{levelIndex=0;questionIndex=0;score=0;streak=0;correctInLevel=0;results=[];updateScore();renderQuestion()});document.getElementById('home').addEventListener('click',()=>{score=0;updateScore();intro()})}
soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊':'🔇';soundBtn.setAttribute('aria-label',soundOn?'Turn sound off':'Turn sound on');if(soundOn)playTone(true)});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(!document.querySelector('.answers')||answered)return;const n=Number(e.key);if(n>=1&&n<=4)chooseAnswer(n-1)});
intro();
</script>
</body>
</html>
